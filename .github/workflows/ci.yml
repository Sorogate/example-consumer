name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Contracts built with soroban-sdk 28 must be built with `stellar contract build`.
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          # This action installs the CLI version named by the ref it is called with. A commit hash names no version, so the
          # version is given here. When Dependabot moves the pin above, move this to the same release.
          version: 28.1.0
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Runs against the real Sorogate policy contract: tests/fixtures/access_policy.wasm, fetched from the public Testnet deployment.
      - run: cargo test
      - run: stellar contract build
